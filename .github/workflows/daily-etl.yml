name: Daily London ETL

on:
  schedule:
    - cron: "15 6 * * *"      # every day at 06:15 UTC
  workflow_dispatch:           # allow manual runs from the Actions tab
    inputs:
      days:
        description: "Lookback window in days (max 14)"
        required: false
        default: "2"

permissions:
  contents: write              # needed to commit the refreshed data

concurrency:
  group: daily-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run pipeline
        run: python -m pipeline.run --days "${{ github.event.inputs.days || '2' }}"

      - name: Commit updated data, chart and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily data update $(date -u +'%Y-%m-%d')"
            git push
          fi
